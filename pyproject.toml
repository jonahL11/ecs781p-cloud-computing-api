[project]
name = "ecs781p-cloud-computing-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.1.9",
